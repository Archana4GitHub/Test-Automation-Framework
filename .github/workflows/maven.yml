# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Test Automation WorkFlow
on:
 schedule:
  - cron: '30 14 * * *'
 push:
    branches: [ "master" ]
 pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Debug repository files
      run: |
       pwd
       echo "Current directory:"
       ls -la
       echo "Contents of testData:"
       ls -la testData || echo "testData folder not found"
       echo "Find JSON files:"
       find . -name "*.json"
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Verify test data file
      run: |
         ls
         ls testData   
    - name: Running Test Automation Framework with Maven
      run: mvn test -X -Dbrowser=chrome -DisLambdaTest=true -DisHeadless=true
    - name: Upload Test logs Artifact
       if:always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: Test logs
        path: logs/

    - name: Upload Test Reports
       if:always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: Test Reports
        path: report.html

    - name: Test Execution Status
      run: echo "Test Execution Completed"
    






  
