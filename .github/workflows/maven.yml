name: Test Automation WorkFlow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Check Environment
      run: |
        java -version
        google-chrome --version
        pwd
        ls -la

    - name: Verify Test Data
      run: |
        find . -name "*.json"

    - name: Run Selenium Tests
      run: |
        mvn test -Dbrowser=chrome -DisHeadless=true

    - name: Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: logs/

    - name: Upload Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: report
        path: report.html


    - name: Upload HTML Report as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: html-report
        path: report.html

    - name: Test Execution Status
      if: always()
      run: echo "Test Execution Completed"

    - name: Copy Report to gh-pages Folder
      if: always() 

      run: |
        mkdir -p public/extent -reports
        cp -R report.html public/extent-reports/
        cp -R screenshots/public/extent-reports/screenshots/
        ls -l
        
    - name: Deploy
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: public/extent-reports/
        token: ${{ secrets.PAT1234 }}
        clean: true

        

        

        
    

        
