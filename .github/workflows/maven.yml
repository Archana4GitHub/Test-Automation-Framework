name: Test Automation WorkFlow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check Environment
        run: |
          java -version
          google-chrome --version
          pwd
          ls -la

      - name: Verify Test Data
        run: |
          find . -name "*.json"

      - name: Run Selenium Tests
        run: |
          mvn test -Dbrowser=chrome -DisHeadless=true

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: report.html

      - name: Test Execution Status
        if: always()
        run: echo "Test Execution Completed"

      - name: Prepare GitHub Pages
        if: always()
        run: |
          mkdir -p public/extent-reports

          echo "Project files:"
          ls -la

          if [ -f report.html ]; then
            cp report.html public/extent-reports/index.html
            echo "Report copied successfully."
          else
            echo "report.html not found!"
            find . -name "*.html"
            exit 1
          fi

          if [ -d screenshots ]; then
            cp -R screenshots public/extent-reports/
          fi

          ls -R public

      - name: Deploy to GitHub Pages
        if: always()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public/extent-reports
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true
